name: Build .NET 4.8 Application

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore dependencies
        shell: pwsh
        run: |
          $sln = if (Test-Path "DetelinaPivotReports.sln") { "DetelinaPivotReports.sln" } else { "DetelinaPivotReports/DetelinaPivotReports.sln" }
          nuget restore $sln

      - name: Build DetelinaPivotReports (.NET Framework 4.8 Release)
        shell: pwsh
        run: |
          $sln = if (Test-Path "DetelinaPivotReports.sln") { "DetelinaPivotReports.sln" } else { "DetelinaPivotReports/DetelinaPivotReports.sln" }
          msbuild $sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Prepare publish folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./publish
          $binPath = if (Test-Path "DetelinaPivotReports/bin/Release") { "DetelinaPivotReports/bin/Release/*" } else { "DetelinaPivotReports/DetelinaPivotReports/bin/Release/*" }
          Copy-Item -Path $binPath -Destination "./publish" -Recurse -Force
          $configPath = if (Test-Path "DetelinaPivotReports/appsettings.json") { "DetelinaPivotReports/appsettings.json" } else { "DetelinaPivotReports/DetelinaPivotReports/appsettings.json" }
          if (Test-Path $configPath) {
            Copy-Item -Path $configPath -Destination "./publish/appsettings.json" -Force
          }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DetelinaPivotReports-net48-Release
          path: ./publish
          retention-days: 30
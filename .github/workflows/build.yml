name: Build .NET 4.8 Application

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore dependencies
        run: nuget restore DetelinaPivotReports/DetelinaPivotReports.sln

      - name: Build DetelinaPivotReports (.NET Framework 4.8 Release)
        run: msbuild DetelinaPivotReports/DetelinaPivotReports.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Prepare publish folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./publish
          Copy-Item -Path "DetelinaPivotReports/DetelinaPivotReports/bin/Release/*" -Destination "./publish" -Recurse -Force
          if (Test-Path "DetelinaPivotReports/DetelinaPivotReports/appsettings.json") {
            Copy-Item -Path "DetelinaPivotReports/DetelinaPivotReports/appsettings.json" -Destination "./publish/appsettings.json" -Force
          }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DetelinaPivotReports-net48-Release
          path: ./publish
          retention-days: 30